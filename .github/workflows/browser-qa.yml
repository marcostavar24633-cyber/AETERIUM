name: Browser QA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { createServer } from 'node:http';
          import { readFile } from 'node:fs/promises';

          const html = await readFile('index.html');
          const server = createServer((req, res) => {
            res.writeHead(200, { 'content-type': 'text/html; charset=utf-8' });
            res.end(html);
          });
          await new Promise(resolve => server.listen(4173, '127.0.0.1', resolve));

          const browser = await chromium.launch({ headless: true });
          const failures = [];
          const check = (condition, label) => {
            if (!condition) failures.push(label);
            console.log(`${condition ? 'PASS' : 'FAIL'} — ${label}`);
          };

          try {
            const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
            const pageErrors = [];
            page.on('pageerror', error => pageErrors.push(error.message));
            await page.goto('http://127.0.0.1:4173', { waitUntil: 'domcontentloaded' });

            check((await page.title()).includes('AETERIUM'), 'page title is present');
            check(await page.locator('#main-content').count() === 1, 'main landmark exists');
            check(await page.locator('#contactForm').count() === 1, 'contact form exists');

            const themeBefore = await page.locator('html').getAttribute('data-theme');
            await page.locator('#theme').click();
            const themeAfter = await page.locator('html').getAttribute('data-theme');
            check(themeBefore !== themeAfter, 'theme toggle changes the active theme');
            await page.reload({ waitUntil: 'domcontentloaded' });
            check(await page.locator('html').getAttribute('data-theme') === themeAfter, 'theme preference persists after reload');

            await page.locator('#navMode').click();
            check(await page.locator('#navMode').getAttribute('aria-expanded') === 'true', 'orbit menu exposes expanded state');
            check(await page.locator('#orbit a').first().evaluate(el => el === document.activeElement), 'orbit menu moves focus to its first link');
            await page.keyboard.press('Escape');
            check(await page.locator('#navMode').getAttribute('aria-expanded') === 'false', 'Escape closes the orbit menu');
            check(await page.locator('#navMode').evaluate(el => el === document.activeElement), 'focus returns to the menu button');

            await page.setViewportSize({ width: 390, height: 844 });
            await page.waitForTimeout(150);
            const mobileOverflow = await page.evaluate(() => document.documentElement.scrollWidth > window.innerWidth + 1);
            check(!mobileOverflow, '390px viewport has no horizontal page overflow');

            await page.setViewportSize({ width: 320, height: 740 });
            await page.waitForTimeout(100);
            const narrowOverflow = await page.evaluate(() => document.documentElement.scrollWidth > window.innerWidth + 1);
            check(!narrowOverflow, '320px viewport has no horizontal page overflow');

            const invalidFormBlocked = await page.locator('#contactForm').evaluate(form => !form.checkValidity());
            check(invalidFormBlocked, 'required form fields block an empty submission');

            const reduced = await browser.newPage({ reducedMotion: 'reduce' });
            await reduced.goto('http://127.0.0.1:4173', { waitUntil: 'domcontentloaded' });
            check(await reduced.evaluate(() => matchMedia('(prefers-reduced-motion: reduce)').matches), 'reduced-motion preference is detected');
            await reduced.close();

            check(pageErrors.length === 0, `no uncaught page errors (${pageErrors.join('; ') || 'none'})`);
          } finally {
            await browser.close();
            await new Promise(resolve => server.close(resolve));
          }

          if (failures.length) {
            console.error(`Browser QA failed: ${failures.join(', ')}`);
            process.exit(1);
          }
          NODE
